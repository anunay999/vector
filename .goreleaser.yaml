version: 2

project_name: vector

builds:
  - id: vector
    main: ./cmd/vector
    binary: vector
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/anunay999/vector/internal/version.Version={{.Version}}
      - -X github.com/anunay999/vector/internal/version.Commit={{.Commit}}
      - -X github.com/anunay999/vector/internal/version.Date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - install.sh

checksum:
  name_template: "vector_checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
